<!DOCTYPE html>
<html lang="zh-Hans">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>薪资管理系统</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<style>
:root{
  --paper:#E8EBE6; --card:#FFFFFF; --ink:#172420; --ink2:#4C5C55;
  --line:#D3D9D0; --jade:#1D6B57; --jade-soft:#E4EFE9;
  --rust:#A6402C; --rust-soft:#F6E7E3; --gold:#8A6A15; --gold-soft:#F2EEDF;
  --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  --sans:-apple-system,BlinkMacSystemFont,"PingFang SC","Noto Sans SC","Microsoft YaHei",sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.5;padding-bottom:90px}
h1,h2,h3{margin:0}
.wrap{max-width:760px;margin:0 auto;padding:0 14px}
header{padding:18px 0 12px}
header .t{font-family:Georgia,"Songti SC",serif;font-size:23px;letter-spacing:.5px}
header .s{font-size:12px;color:var(--ink2);letter-spacing:2px;text-transform:uppercase;margin-top:2px}
nav{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--line);display:flex;z-index:40;padding-bottom:env(safe-area-inset-bottom)}
nav button{flex:1;border:0;background:none;padding:11px 2px 13px;font-family:inherit;font-size:11.5px;color:var(--ink2);cursor:pointer}
nav button .ic{display:block;font-size:17px;line-height:1.2}
nav button.on{color:var(--jade);font-weight:600}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px;margin-bottom:12px}
.card h3{font-size:13px;letter-spacing:1.5px;text-transform:uppercase;color:var(--ink2);margin-bottom:10px;font-weight:600}
label{display:block;font-size:12.5px;color:var(--ink2);margin:0 0 4px}
input:not([type=checkbox]),select,textarea{width:100%;font-family:inherit;font-size:15px;padding:9px 10px;border:1px solid var(--line);border-radius:7px;background:#fff;color:var(--ink)}
input[type=number]{font-family:var(--mono);font-variant-numeric:tabular-nums}
input:focus,select:focus,textarea:focus{outline:2px solid var(--jade);outline-offset:-1px;border-color:var(--jade)}
.row{display:flex;gap:9px;flex-wrap:wrap}.row>div{flex:1;min-width:110px}
.f{margin-bottom:10px}
button.btn{font-family:inherit;font-size:14px;font-weight:600;padding:10px 15px;border-radius:8px;border:1px solid var(--jade);background:var(--jade);color:#fff;cursor:pointer}
button.btn.alt{background:#fff;color:var(--jade)}
button.btn.warn{background:#fff;color:var(--rust);border-color:var(--rust)}
button.btn.sm{font-size:12.5px;padding:6px 10px;border-radius:6px}
.hint{font-size:12px;color:var(--ink2);margin-top:5px}
.empty{text-align:center;padding:28px 14px;color:var(--ink2);font-size:14px}
.seg{display:flex;background:#fff;border:1px solid var(--line);border-radius:9px;overflow:hidden;margin-bottom:12px}
.seg button{flex:1;border:0;background:none;padding:11px 4px;font-family:inherit;font-size:14.5px;font-weight:600;color:var(--ink2);cursor:pointer}
.seg button.on{background:var(--ink);color:#fff}
.emp{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;padding:11px 0;border-bottom:1px solid var(--line)}
.emp:last-child{border-bottom:0}
.emp .nm{font-weight:600}
.emp .mt{font-size:12px;color:var(--ink2);margin-top:2px}
.tag{display:inline-block;font-size:11px;padding:1px 7px;border-radius:20px;background:var(--jade-soft);color:var(--jade);margin-right:5px}
.tag.g{background:var(--gold-soft);color:var(--gold)}
.tag.q{background:#EDEFEC;color:var(--ink2)}
.chk{display:flex;flex-direction:column;gap:2px;margin:8px 0}
.chk label{display:flex;align-items:center;gap:9px;font-size:14.5px;color:var(--ink);padding:7px 0;margin:0;border-bottom:1px solid #F0F2EE}
.chk label:last-child{border-bottom:0}
.chk input{width:auto}
.slip{background:#fff;border:1px solid var(--line);border-radius:10px;overflow:hidden;margin-bottom:12px}
.slip .hd{padding:12px 14px;border-bottom:1px dashed var(--line);display:flex;justify-content:space-between;align-items:baseline}
.slip .hd .n{font-weight:700;font-size:16px}
.slip .hd .p{font-family:var(--mono);font-size:12px;color:var(--ink2)}
.slip .bd{padding:6px 14px}
.ln{display:flex;justify-content:space-between;align-items:baseline;padding:5px 0;font-size:14px;border-bottom:1px solid #F0F2EE}
.ln:last-child{border-bottom:0}
.ln .k{color:var(--ink2)}
.ln .v{font-family:var(--mono);font-variant-numeric:tabular-nums}
.ln.add .v{color:var(--jade)}
.ln.sub .v{color:var(--rust)}
.ln.sec{border-top:1px dashed var(--line);margin-top:6px;padding-top:9px}
.ln.sec .k{font-size:11.5px;letter-spacing:1.4px;text-transform:uppercase;color:var(--ink2);font-weight:600}
.net{background:var(--ink);color:#fff;padding:13px 14px;display:flex;justify-content:space-between;align-items:baseline}
.net.gold{background:var(--gold)}
.net .k{font-size:12px;letter-spacing:2px;text-transform:uppercase;opacity:.85}
.net .v{font-family:var(--mono);font-size:21px;font-weight:700}
.er{padding:9px 14px;background:#F7F9F6;border-top:1px solid var(--line);font-size:12px;color:var(--ink2);font-family:var(--mono)}
.auto{background:var(--rust-soft);border:1px solid #E7C9C1;color:var(--rust);border-radius:7px;padding:8px 10px;font-size:12.5px;margin:8px 0 0}
.hrow{border:1px solid var(--line);background:#fff;border-radius:10px;padding:12px;margin-bottom:10px}
.hrow.comm{border-left:4px solid var(--gold)}
.hrow.base{border-left:4px solid var(--jade)}
.hrow .top{display:flex;justify-content:space-between;align-items:baseline}
.hrow .amt{font-family:var(--mono);font-weight:700;font-size:16px}
.hrow .sub{font-size:12px;color:var(--ink2);margin-top:3px;font-family:var(--mono)}
.hrow .acts{display:flex;gap:7px;margin-top:9px}
.totbar{background:var(--ink);color:#fff;border-radius:10px;padding:12px 14px;margin-bottom:12px;font-family:var(--mono);font-size:13px}
.totbar div{display:flex;justify-content:space-between;padding:2px 0}
.note{border-left:3px solid var(--gold);background:#fff;border-radius:0 8px 8px 0;padding:10px 12px;margin-bottom:9px}
.note .d{font-size:11.5px;color:var(--ink2);font-family:var(--mono)}
.note.done{opacity:.5}
input[type=checkbox]{-webkit-appearance:checkbox;appearance:checkbox;width:20px;height:20px;min-width:20px;margin:0;padding:0;border:0;background:none;accent-color:var(--jade,#334C8C);flex:none}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:78px;background:var(--ink);color:#fff;padding:9px 16px;border-radius:22px;font-size:13.5px;z-index:60;opacity:0;transition:opacity .2s}
.toast.on{opacity:1}
.warnbox{background:var(--rust-soft);border:1px solid #E7C9C1;color:var(--rust);border-radius:8px;padding:9px 11px;font-size:13px;margin-bottom:10px}
hr.d{border:0;border-top:1px dashed var(--line);margin:12px 0}
#gate{position:fixed;inset:0;background:var(--paper);z-index:200;display:none;overflow:auto;padding:28px 16px}
#gate .box{max-width:420px;margin:6vh auto}
#gate h2{font-family:Georgia,"Songti SC",serif;font-size:24px;margin:0 0 4px}
#gate .sub{font-size:13px;color:var(--ink2);margin-bottom:20px}
.syncdot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px;vertical-align:1px}
.syncdot.on{background:var(--jade)}.syncdot.off{background:var(--rust)}.syncdot.busy{background:var(--gold)}
.brow{background:#fff;border:1px solid var(--line);border-left:4px solid var(--line);border-radius:10px;padding:10px 12px;margin-bottom:8px}
.brow.saved{border-left-color:var(--jade)}
.brow .top{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.brow .nm{font-weight:600;font-size:14px}
.brow .amt{font-family:var(--mono);font-weight:700;font-size:15px;white-space:nowrap}
.brow .bin{display:grid;grid-template-columns:repeat(auto-fill,minmax(66px,1fr));gap:6px;margin-top:8px}
.brow .bin label{font-size:11px;margin:0 0 2px}
.brow .bin input{padding:6px 7px;font-size:14px}
.brow .bx{font-size:11.5px;color:var(--rust);margin-top:5px}
.brow .bx:empty{display:none}
#printArea{display:none}
@page{size:A4;margin:14mm}
@media print{
  body.printing{background:#fff;padding:0}
  body.printing>*:not(#printArea){display:none!important}
  body.printing #printArea{display:block}
}
.ps{font-family:Arial,"Microsoft YaHei","PingFang SC",sans-serif;color:#000;font-size:12.5px;max-width:720px;margin:0 auto;break-after:page;page-break-after:always}
.ps:last-child{break-after:auto;page-break-after:auto}
.ps .ph{display:flex;justify-content:space-between;align-items:flex-end;border-bottom:2px solid #000;padding-bottom:8px;margin-bottom:10px}
.ps .co{font-size:17px;font-weight:700}
.ps .ti{font-size:13px;letter-spacing:2px;margin-top:2px}
.ps .pd{text-align:right;font-size:12px}
.ps .who{font-size:14px;font-weight:700;margin:0 0 10px}
.ps table{width:100%;border-collapse:collapse;margin-bottom:12px}
.ps th{text-align:left;font-size:11px;letter-spacing:1px;text-transform:uppercase;border-bottom:1px solid #000;padding:5px 4px;background:#f2f2f2}
.ps td{padding:4px;border-bottom:1px solid #ddd}
.ps td.n{text-align:right;font-family:Consolas,Menlo,monospace;white-space:nowrap}
.ps .zh{color:#666;font-size:11px;margin-left:5px}
.ps tr.t td{font-weight:700;border-top:1px solid #000;border-bottom:0}
.ps tr.pnet td{font-weight:700;font-size:14px;background:#f2f2f2;border-bottom:2px solid #000}
.ps .ft{font-size:10.5px;color:#666;margin-top:14px}
#syncbar{position:fixed;top:0;left:0;right:0;background:var(--ink);color:#fff;font-size:12px;padding:5px 12px;z-index:150;display:none;text-align:center}
</style>
</head>
<body>
<div class="wrap">
  <header><h1 class="t">薪资管理系统</h1><div class="s">Payroll · Malaysia · 云端版 v3</div></header>
  <div id="view"></div>
</div>
<nav>
  <button data-t="calc" class="on"><span class="ic">▤</span>计算</button>
  <button data-t="emp"><span class="ic">☰</span>员工</button>
  <button data-t="hist"><span class="ic">⤓</span>历史</button>
  <button data-t="note"><span class="ic">✎</span>备忘</button>
  <button data-t="set"><span class="ic">⚙</span>设定</button>
</nav>
<div class="toast" id="toast"></div>
<div id="syncbar"></div>
<div id="printArea"></div>
<div id="gate"><div class="box">
  <h2>薪资管理系统</h2>
  <div class="sub">资料存在你自己的 Supabase，手机电脑自动同步</div>
  <div class="card" id="cfgCard">
    <h3>第一步 · 连接 Supabase</h3>
    <div class="f"><label>Project URL</label><input id="g_url" placeholder="https://xxxx.supabase.co"></div>
    <div class="f"><label>anon public key</label><input id="g_key" placeholder="eyJhbGciOi..."></div>
    <button class="btn" style="width:100%" onclick="saveCfg()">保存并连接</button>
    <div class="hint">在 Supabase 后台 Settings → API 里复制。只存在这台机器，不会外传。</div>
  </div>
  <div class="card" id="authCard" style="display:none">
    <h3>第二步 · 登入</h3>
    <div class="f"><label>Email</label><input id="g_email" type="email" autocomplete="username"></div>
    <div class="f"><label>密码</label><input id="g_pw" type="password" autocomplete="current-password"></div>
    <button class="btn" style="width:100%" onclick="doLogin()">登入</button>
    <button class="btn alt sm" style="width:100%;margin-top:8px" onclick="doSignup()">第一次用 · 注册</button>
    <div class="hint" id="authMsg"></div>
    <div class="hint">用户名就是你的 email。密码自己设，至少 6 个字。</div>
    <hr class="d">
    <button class="btn alt sm" style="width:100%" onclick="clearCfg()">换一个 Supabase 项目</button>
  </div>
</div></div>

<script>
const K={emp:'payroll:employees',hist:'payroll:history',note:'payroll:notes',trash:'payroll:trash',set:'payroll:settings'};
const TRASH_DAYS=30;
const K_SNAP='payroll:snapshots', K_META='payroll:meta';

/* 存储：在 Claude 里用 window.storage；下载成文件后自动改用浏览器本机存储 */
/* 本机快取（离线也能用），云端是 Supabase */
const STORE={
  async get(k){ const v=localStorage.getItem(k); return v?{key:k,value:v}:null; },
  async set(k,v){ localStorage.setItem(k,v); return {key:k,value:v}; }
};
let SB=null, USER=null, CFG={url:'',key:''}, SYNCED={emp:{},hist:{},note:{},trash:{},set:null}, SYNCED_OK=false;
const LISTS=['emp','hist','note','trash'];
/* SYNCED = 云端上次确认的内容。存进本机，重开 App 才知道哪些改动还没推上去 */
const K_SYNCED='payroll:synced', K_OWNER='payroll:owner';
function loadSynced(){
  SYNCED={emp:{},hist:{},note:{},trash:{},set:null}; SYNCED_OK=false;
  try{ const o=JSON.parse(localStorage.getItem(K_SYNCED)||'null');
    if(o&&USER&&o.uid===USER.id&&o.data){ SYNCED={...SYNCED,...o.data}; SYNCED_OK=true; } }catch(e){}
}
function saveSynced(){ if(!USER)return; try{ localStorage.setItem(K_SYNCED,JSON.stringify({uid:USER.id,data:SYNCED})); }catch(e){} }
/* 本机快取是谁的。换人登入就先清掉，免得看到上一个人的资料 */
function localOwner(){
  const o=localStorage.getItem(K_OWNER); if(o)return o;
  try{ const s=JSON.parse(localStorage.getItem(K_SYNCED)||'null'); return s&&s.uid||null; }catch(e){ return null; }
}
function clearLocal(){ [...Object.values(K),K_SNAP,K_META,K_SYNCED,K_OWNER].forEach(k=>localStorage.removeItem(k)); }
/* 还没传上云端的项目数 */
function pendingCount(){
  if(!SYNCED_OK)return 0;
  let n=0;
  LISTS.filter(k=>!(k==='trash'&&TRASH_NO_DB)).forEach(k=>{ const ids=new Set(S[k].map(x=>x.id));
    S[k].forEach(x=>{ if(SYNCED[k][x.id]!==JSON.stringify(x))n++; });
    Object.keys(SYNCED[k]).forEach(id=>{ if(!ids.has(id))n++; }); });
  if(JSON.stringify(S.set)!==SYNCED.set)n++;
  return n;
}
/* 同步动作排队，一次一个，避免拉取和推送互相盖 */
let SYNC_Q=Promise.resolve(), RETRY=null, TRASH_NO_DB=false;
const queue=fn=>(SYNC_Q=SYNC_Q.then(fn,fn));
/* 部署时可以直接填好 Supabase 的 Project URL 和 anon public key（这两样本来就是公开的），
   每台电脑就不用再输入。留空 = 第一次打开时在画面上输入 */
const PRESET_CFG={url:'',key:''};
function loadCfg(){ try{ CFG=JSON.parse(localStorage.getItem('payroll:sbcfg')||'{}'); }catch(e){ CFG={}; }
  if(!(CFG.url&&CFG.key)&&!CFG.manual&&PRESET_CFG.url&&PRESET_CFG.key)CFG={...PRESET_CFG};
  return CFG.url&&CFG.key; }
function saveCfg(){
  const u=document.getElementById('g_url').value.trim().replace(/\/$/,'');
  const k=document.getElementById('g_key').value.trim();
  if(!u||!k){ gateMsg('两样都要填'); return; }
  CFG={url:u,key:k}; localStorage.setItem('payroll:sbcfg',JSON.stringify(CFG));
  initSB(); showAuth();
}
function clearCfg(){ localStorage.setItem('payroll:sbcfg','{"manual":1}'); location.reload(); }   // manual：不要再套用 PRESET_CFG
function initSB(){ try{ SB=window.supabase.createClient(CFG.url,CFG.key);
  SB.auth.onAuthStateChange(ev=>{ if(ev==='SIGNED_OUT')sessionLost(); });   // 别处登出／凭证失效
  return true; }catch(e){ gateMsg('连不上：'+e.message); return false; } }
function gateMsg(m){ const el=document.getElementById('authMsg'); if(el)el.textContent=m; }
function showGate(){ document.getElementById('gate').style.display='block'; }
function showAuth(){ document.getElementById('cfgCard').style.display='none'; document.getElementById('authCard').style.display='block'; }
function hideGate(){ document.getElementById('gate').style.display='none'; }
function syncBar(state,msg){
  const b=document.getElementById('syncbar'); if(!b)return;
  if(!msg){ b.style.display='none'; return; }
  b.style.display='block'; b.innerHTML='<span class="syncdot '+state+'"></span>'+esc(msg);
  if(state==='on') setTimeout(()=>{ if(b.textContent.includes(msg)) b.style.display='none'; },2500);
}
async function doLogin(){
  if(!SB&&!initSB())return;
  const email=document.getElementById('g_email').value.trim(), pw=document.getElementById('g_pw').value;
  gateMsg('登入中…');
  const {data,error}=await SB.auth.signInWithPassword({email,password:pw});
  if(error){ gateMsg('登入失败：'+error.message); return; }
  USER=data.user; await afterLogin();
}
async function doSignup(){
  if(!SB&&!initSB())return;
  const email=document.getElementById('g_email').value.trim(), pw=document.getElementById('g_pw').value;
  if(pw.length<6){ gateMsg('密码至少 6 个字'); return; }
  gateMsg('注册中…');
  const {data,error}=await SB.auth.signUp({email,password:pw});
  if(error){ gateMsg('注册失败：'+error.message); return; }
  if(!data.session){ gateMsg('注册成功，去 email 收确认信，确认后回来登入'); return; }
  USER=data.user; await afterLogin();
}
/* 登出：先把没传完的推上去；推不上就要再按一次确认。登出后清掉这台电脑上的薪资资料 */
let LOGGING_OUT=false;
async function doLogout(){
  await pushAll();
  const n=pendingCount(), lt=TRASH_NO_DB?S.trash.length:0;
  if((n||lt)&&delArm!=='logout'){ delArm='logout'; render();
    toast(n?'还有 '+n+' 项没传上云端，再按一次会丢掉':'回收站 '+lt+' 项只存在这台电脑，登出会清掉。再按一次确认'); return; }
  LOGGING_OUT=true;
  // 只登出这台电脑（scope:'local'），不影响另一台。没网路时 signOut 会失败，所以登入凭证一律自己删
  try{ if(SB){ const {error}=await SB.auth.signOut({scope:'local'}); if(error)throw error; } }catch(e){}
  // 只删薪资系统自己那个 Supabase 项目的凭证。跟别的系统放在同一个网址时，不能动到别人的登入
  try{ if(SB&&SB.auth.storageKey)localStorage.removeItem(SB.auth.storageKey); }catch(e){}
  try{ localStorage.removeItem('sb-'+new URL(CFG.url).hostname.split('.')[0]+'-auth-token'); }catch(e){}
  clearLocal(); location.reload();
}
/* 登入还有效吗？true＝有效；false＝失效要重新登入；null＝只是网路不通 */
async function sessionOK(){
  if(!SB.auth||!SB.auth.getSession)return true;
  try{
    const {data,error}=await SB.auth.getSession();
    if(data&&data.session)return true;
    if(error&&/fetch|network|retryable/i.test((error.name||'')+' '+(error.message||'')))return null;
    return false;
  }catch(e){ return null; }
}
/* 登入过期：盖上登入画面，本机还没传的资料留着，重新登入后会补推 */
function sessionLost(){
  if(!USER||LOGGING_OUT)return;
  syncBar('off','登入已过期，请重新登入（还没传上去的资料会保留）');
  showGate(); showAuth(); gateMsg('登入已过期，请重新登入');
}
async function afterLogin(){
  hideGate();
  const owner=localOwner();
  if(owner&&owner!==USER.id) clearLocal();
  localStorage.setItem(K_OWNER,USER.id);
  await load(); loadSynced(); syncBar('busy','正在拉取云端资料…');
  await pullAll(); render();
}
/* 云端分页拉，一页最多 1000 笔（Supabase 上限），拉到没有为止 */
async function fetchAll(){
  const out=[];
  for(let from=0;;){
    const {data,error}=await SB.from('payroll_rows').select('kind,row_id,data').eq('user_id',USER.id)
      .order('kind').order('row_id').range(from,from+999);
    if(error)throw error;
    if(!data||!data.length)break;
    out.push(...data); from+=data.length;
  }
  return out;
}
/* 拉云端：云端为准，但本机还没推上去的改动（新增／修改／删除）保留，拉完马上补推 */
function pullAll(){ return queue(_pull); }
async function _pull(){
  if(!SB||!USER)return false;
  const before=JSON.stringify([S.emp,S.hist,S.note,S.set]);
  // 登入失效时 RLS 会回传「0 笔」而不是错误，不能当成云端是空的
  const ok=await sessionOK();
  if(ok===false){ sessionLost(); return false; }
  if(ok===null){ syncBar('off','连不上网路，资料在本机，会自动重试'); retryLater(); return false; }
  try{
    const data=await fetchAll();
    const g={emp:[],hist:[],note:[],trash:[]};
    let st=null;
    data.forEach(r=>{ if(r.kind==='set'){ if(r.row_id==='main')st=r.data; } else if(g[r.kind])g[r.kind].push(r.data); });
    LISTS.forEach(k=>{
      const cloud={}; g[k].forEach(x=>cloud[x.id]=JSON.stringify(x));
      let out=g[k];
      if(SYNCED_OK){
        const localIds=new Set(S[k].map(x=>x.id));
        const dirty=S[k].filter(x=>SYNCED[k][x.id]!==JSON.stringify(x));
        const dirtyIds=new Set(dirty.map(x=>x.id));
        const removed=new Set(Object.keys(SYNCED[k]).filter(id=>!localIds.has(id)));
        out=g[k].filter(x=>!removed.has(x.id)&&!dirtyIds.has(x.id)).concat(dirty);
      }
      S[k]=out; SYNCED[k]=cloud;
    });
    const setDirty=SYNCED_OK&&SYNCED.set!==null&&JSON.stringify(S.set)!==SYNCED.set;
    if(st&&!setDirty){ S.set={...DEF_SET,...st}; SYNCED.set=JSON.stringify(S.set); }
    else SYNCED.set=st?JSON.stringify(st):null;
    S.trash=S.trash.filter(t=>Date.now()-(+t.ts||0)<TRASH_DAYS*86400000);   // 回收站只留 30 天
    SYNCED_OK=true; saveSynced();
    for(const k of [...LISTS,'set']) await STORE.set(K[k],JSON.stringify(S[k]));
    let ok=true;
    for(const k of [...LISTS,'set']) ok=(await _push(k))&&ok;
    if(ok) syncBar('on','已同步');
  }catch(e){ syncBar('off','拉取失败，资料仍在本机：'+e.message); retryLater(); }
  const changed=before!==JSON.stringify([S.emp,S.hist,S.note,S.set]);
  if(changed)batchInvalidate();
  return changed;
}
function pushKind(k){ return queue(()=>_push(k)); }
function pushAll(){ return queue(async()=>{ for(const k of [...LISTS,'set']) await _push(k); }); }
function retryLater(){ clearTimeout(RETRY); RETRY=setTimeout(()=>pullAll().then(ch=>{ if(ch)safeRender(); }),20000); }
async function _push(k){
  if(!SB||!USER||!SYNCED_OK)return true;
  if(k==='trash'&&TRASH_NO_DB)return true;
  try{
    if(k==='set'){
      const j=JSON.stringify(S.set); if(j===SYNCED.set)return true;
      const {error}=await SB.from('payroll_rows').upsert({user_id:USER.id,kind:'set',row_id:'main',data:S.set,updated_at:new Date().toISOString()},{onConflict:'user_id,kind,row_id'});
      if(error)throw error; SYNCED.set=j; saveSynced(); return true;
    }
    const cur={}; S[k].forEach(x=>cur[x.id]=JSON.stringify(x));
    const up=S[k].filter(x=>SYNCED[k][x.id]!==cur[x.id])
      .map(x=>({user_id:USER.id,kind:k,row_id:x.id,data:x,updated_at:new Date().toISOString()}));
    const gone=Object.keys(SYNCED[k]).filter(id=>!(id in cur));
    for(let i=0;i<up.length;i+=500){ const {error}=await SB.from('payroll_rows').upsert(up.slice(i,i+500),{onConflict:'user_id,kind,row_id'}); if(error)throw error; }
    for(let i=0;i<gone.length;i+=200){ const {error}=await SB.from('payroll_rows').delete().eq('user_id',USER.id).eq('kind',k).in('row_id',gone.slice(i,i+200)); if(error)throw error; }
    SYNCED[k]=cur; saveSynced();
    if(up.length||gone.length) syncBar('on','已同步到云端');
    return true;
  }catch(e){
    // 回收站要先在 Supabase 跑 supabase-upgrade-v3.sql；没跑之前只存在这台电脑，不影响其他资料同步
    if(k==='trash'&&(e.code==='23514'||/check constraint/i.test(e.message||''))){ TRASH_NO_DB=true; toast('回收站暂时只存在这台电脑（Supabase 还没升级）'); return true; }
    if(e.code==='42501'||/row-level security|JWT/i.test(e.message||'')){ sessionLost(); return false; }   // 登入失效
    syncBar('off','还没传上云端，资料在本机，会自动重试：'+e.message); retryLater(); return false;
  }
}

function socsoRow(w){ for(const r of SOCSO_TBL) if(w<=r[0]) return r; return SOCSO_TBL[SOCSO_TBL.length-1]; }
/* EIS (Act 800)：级距中间值 × 0.2%，双方各付，上限 RM6,000 */
function eisAmt(w){ let lo=0; for(const r of SOCSO_TBL){ if(w<=r[0]) return r2((lo+r[0])/2*0.002); lo=r[0]; } return r2(5950*0.002); }
/* EPF 第三附表：RM10 以下不缴；≤RM5,000 每 RM20 一级；RM5,000–20,000 每 RM100 一级；
   都取级距上限算百分比，最后进位到令吉。超过 RM20,000 直接按实际薪金 */
function epfWage(w){
  if(w<=10)return 0;
  if(w>20000)return w;
  return w>5000?Math.ceil(w/100-1e-9)*100:Math.ceil(w/20-1e-9)*20;
}
const pos=v=>Math.max(0,+v||0);                               // 不准负数的栏位一律当 0

/* 入职／离职：哪个月算在职、当月有几个工作天不在职 */
const ymd=(y,m,d)=>y+'-'+String(m).padStart(2,'0')+'-'+String(d).padStart(2,'0');
const monthEnd=(y,m)=>new Date(y,m,0).getDate();
function inMonth(e,y,m){
  if(e.joinDate&&e.joinDate>ymd(y,m,monthEnd(y,m)))return false;
  if(e.leaveDate)return e.leaveDate>=ymd(y,m,1);
  return e.status!=='left';
}
function absentDays(e,y,m){
  if(!e.joinDate&&!e.leaveDate)return 0;
  let n=0; const d=new Date(y,m-1,1);
  while(d.getMonth()===m-1){ const s=ymd(y,m,d.getDate());
    if(d.getDay()!==0&&((e.joinDate&&s<e.joinDate)||(e.leaveDate&&s>e.leaveDate)))n++;
    d.setDate(d.getDate()+1); }
  return n;
}
const isLeft=e=>e.status==='left'||!!(e.leaveDate&&e.leaveDate<ymd(new Date().getFullYear(),new Date().getMonth()+1,new Date().getDate()));

/* ===== 第一部分：底薪 ===== */
function calcBase(e,i){
  const st=S.set, base=pos(e.base);
  const wd=Math.max(1,pos(i.workDays)||workDays(i.year,i.month));
  const otHours=pos(i.otHours);
  const otTotal=rInt(base/wd/8*1.5*otHours);
  const absentCal=absentDays(e,i.year,i.month);               // 入职前／离职后的工作天（照日历数）
  const absent=Math.min(wd,absentCal*wd/workDays(i.year,i.month));   // 手动改过工作天数时按比例换算
  const absentDeduct=rInt(base/wd*absent);
  const unpaidDays=Math.min(pos(i.unpaidDays),r2(wd-absent));
  const unpaidDeduct=rInt(base/wd*(absent+unpaidDays))-absentDeduct;   // 两项一起取整，合计不会超过底薪
  const statWage=r2(Math.max(0,base-absentDeduct-unpaidDeduct));   // 法定基数 = 底薪 − 未在职 − 无薪假
  const cat=e.category||'local';
  const ew=epfWage(statWage);
  let epfEmp=0,epfEr=0;
  if(cat==='local'){epfEmp=ceilRM(ew*st.epfEmpLocal/100);epfEr=ceilRM(ew*(statWage<=st.epfErThreshold?st.epfErLow:st.epfErHigh)/100);}
  else if(cat==='local60'){epfEmp=ceilRM(ew*st.epfEmp60/100);epfEr=ceilRM(ew*st.epfEr60/100);}
  else{epfEmp=e.epfOptIn?ceilRM(ew*st.epfEmpLocal/100):0;
       epfEr=e.epfOptIn?ceilRM(ew*st.epfErLow/100):st.epfForeignErFlat;}
  // SOCSO：查 Act 4 官方表
  const row=socsoRow(statWage);
  const skbbkOn = e.skbbk!==false;
  let socsoEmp=0,socsoEr=0;
  if(statWage>0){
    if(cat==='local'){ socsoEr=row[1]; socsoEmp=r2(row[2]+(skbbkOn?row[3]:0)); }
    else { socsoEr=row[4]; socsoEmp=skbbkOn?row[5]:0; }     // 60岁以上／外劳：第二类
  }
  // EIS：60岁以上及外劳豁免
  let eisEmp=0,eisEr=0;
  if(cat==='local'&&statWage>0){ eisEmp=eisAmt(statWage); eisEr=eisEmp; }
  // 个别豁免
  if(e.noEpf){epfEmp=0;epfEr=0;}
  if(e.noSocso){socsoEmp=0;socsoEr=0;}
  if(e.noEis){eisEmp=0;eisEr=0;}
  const pcb=base>st.pcbThreshold?pos(i.pcb):0;
  const advance=+i.advance||0;                                  // 负数 = 补发
  let payComm=0, baseSales=0, baseRate=0, basePayComm=0, baseExtraComm=0;
  if(e.commWithBase){
    if(e.commType==='percent'){
      baseSales=pos(i.baseSales); baseRate=(i.baseRate!=null&&i.baseRate!=='')?pos(i.baseRate):pos(e.commRate);
      payComm=r10c(baseSales*baseRate/100);
    } else { basePayComm=pos(i.basePayComm); payComm=r10c(basePayComm); }
    baseExtraComm=pos(i.baseExtraComm);
    payComm=r2(payComm+baseExtraComm);
  }
  const gross=r2(base-absentDeduct-unpaidDeduct+otTotal+payComm);
  const net=r2(gross-epfEmp-socsoEmp-eisEmp-pcb-advance);
  return {base,workDays:wd,skbbk:skbbkOn,payComm,baseSales,baseRate,basePayComm,baseExtraComm,otHours,otTotal,
    absentDays:absentCal,absentDeduct,unpaidDays,unpaidDeduct,
    statWage,epfEmp,epfEr,socsoEmp,socsoEr,eisEmp,eisEr,pcb,advance,gross,net};
}

/* ===== 第二部分：佣金 ===== */
function calcComm(e,i){
  const st=S.set, base=pos(e.base);
  const wd=Math.max(1,pos(i.workDays)||workDays(i.year,i.month));
  const dayRate=base/wd;

  let commPersonal=0;
  if(e.commType==='percent')commPersonal=r10c(pos(i.sales)*pos(e.commRate)/100);
  else if(e.commType==='fixed')commPersonal=r10c(pos(e.commRate));

  let commGroup = e.groupComm===false ? 0 : r10c(pos(i.commGroup));
  const commGroupIn = commGroup;                              // 原始输入，编辑时要用这个，不是扣完的
  const late=pos(i.lateCount);
  const groupVoided = late>=st.lateNoGroup && commGroup>0;
  if(late>=st.lateNoGroup) commGroup=0;                       // 迟到达标自动取消团体佣金

  const wrongQty=pos(i.wrongQty);
  const wrongGoods=r2(wrongQty*st.wrongGoodsRate);            // 每包 RM10
  const lateUnits=Math.floor(late/st.lateUnit);               // 每 3 次 = 半天
  const lateDeduct=rInt(lateUnits*dayRate*st.lateFraction);
  const otherDeduct=+i.otherDeduct||0;                        // 负数 = 补发
  const totalDeduct=r2(wrongGoods+lateDeduct+Math.max(0,otherDeduct));
  let extraPay=otherDeduct<0?r2(-otherDeduct):0;

  // 佣金本身取到 RM0.10；扣款照实扣到仙
  let left=totalDeduct;
  const gTake=Math.min(left,commGroup); commGroup=r2(commGroup-gTake); left=r2(left-gTake);
  const pTake=Math.min(left,commPersonal); commPersonal=r2(commPersonal-pTake); left=r2(left-pTake);
  const xTake=Math.min(left,extraPay); extraPay=r2(extraPay-xTake); left=r2(left-xTake);
  const spill=r2(left);
  const payout=r2(commPersonal+commGroup+extraPay);

  return {base,workDays:wd,sales:pos(i.sales),commPersonal,commGroup,commGroupIn,groupVoided,
    lateCount:late,lateUnits,lateDeduct,wrongQty,wrongGoods,otherDeduct,extraPay,totalDeduct,spill,payout};
}

function vCalc(){
  if(!S.emp.length)return '<div class="card"><div class="empty">还没有员工资料。<br>先到「员工」加人，再回来计算。</div></div>';
  if(mode==='batch')return backupCard()+SEG()+vBatch();
  const now=new Date(), y=FRM.year||now.getFullYear(), m=FRM.month||now.getMonth()+1;
  // 名单 = 这个月在职的人（含当月离职、当月入职）；编辑旧记录时一定带上那位员工
  let act=S.emp.filter(x=>inMonth(x,y,m)).sort(nameSort);
  if(!act.length) act=S.emp.slice().sort(nameSort);
  if(mode==='base'){ const wb=act.filter(x=>!x.commOnly||x.commWithBase); if(wb.length) act=wb; }
  const editing=editId&&S.hist.find(h=>h.id===editId);
  if(editId&&!editing)editId=null;                              // 正在编辑的那笔被删了（或另一台删了）
  if(editing&&!act.some(x=>x.id===editing.empId)){ const ee=S.emp.find(x=>x.id===editing.empId); if(ee) act=[ee,...act]; }
  const eid=(FRM.eid&&act.some(x=>x.id===FRM.eid))?FRM.eid:act[0].id;
  const e=empOf(eid)||act[0];
  const wd=FRM.workDays||workDays(y,m);
  const head=`

  return head + (mode==='base'?vBase(e):vComm(e)) + `<div id="slip"></div>
  <div class="card">
    <div class="f"><label>备注</label><input type="text" id="remark" value="${esc(FRM.remark??'')}" placeholder="选填"></div>
    ${dupPending?`<div class="warnbox"><b>${esc(dupPending.rec.empName)}　${dupPending.rec.year}／${MON[dupPending.rec.month-1]}　${dupPending.rec.type==='base'?'底薪':'佣金'}已经有一笔了</b><br>原本那笔：${money(dupPending.dupAmt)}　这次算出：${money(dupPending.rec.type==='base'?dupPending.rec.net:dupPending.rec.payout)}</div>
      <div class="row" style="margin-bottom:10px">
        <div><button class="btn" style="width:100%" onclick="dupChoose('replace')">覆盖原本那笔</button></div>
        <div><button class="btn alt sm" style="width:100%;padding:10px" onclick="dupChoose('add')">还是另存一笔</button></div>
      </div>
      <button class="btn alt sm" style="width:100%" onclick="dupChoose('cancel')">取消</button>`
    :`<button class="btn" style="width:100%" onclick="saveRun()">${editId?'更新这笔记录':(mode==='base'?'存入历史（底薪）':'存入历史（佣金）')}</button>`}
    ${editId?'<button class="btn alt sm" style="width:100%;margin-top:8px" onclick="editId=null;FRM={};render()">取消编辑</button>':''}
  </div>`;
}

function setMode(m){collect();mode=m;editId=null;dupPending=null;render();}

      if(c.groupVoided)bits.push(`迟到满 ${S.set.lateNoGroup} 次 → 团体佣金归零`);

       <div class="bd">
         ${(()=>{ // 列扣款前的金额，各行加起来 = 佣金实发
           const P=e.commType==='percent'?r10c(c.sales*pos(e.commRate)/100):e.commType==='fixed'?r10c(pos(e.commRate)):0;
           const G=c.groupVoided?0:c.commGroupIn, X=Math.max(0,-c.otherDeduct);
           return (e.commType==='percent'?L('销售额 '+money(c.sales)+' × '+e.commRate+'%',P,'add'):'')
             +(e.commType==='fixed'?L('个人佣金（固定）',P,'add'):'')

         ${c.otherDeduct>0?L('其他扣款',-c.otherDeduct,'sub'):''}
         ${c.spill?L('不够扣、没扣到的部分（结欠）',c.spill,'add'):''}
       </div>
       <div class="net gold"><span class="k">佣金实发</span><span class="v">${money(c.payout)}</span></div>

     </div>`;

/* ---- 回收站：删掉或被改掉的旧版本，留 30 天可救回 ---- */
let TRASH_CHG=false;
/* 比内容不看栏位顺序（Supabase 拉回来的 jsonb 栏位顺序会变） */
const canon=o=>Array.isArray(o)?'['+o.map(canon).join(',')+']'
  :o&&typeof o==='object'?'{'+Object.keys(o).sort().map(k=>JSON.stringify(k)+':'+canon(o[k])).join(',')+'}'
  :JSON.stringify(o===undefined?null:o);
const sameRec=(a,b)=>canon({...a,ts:0})===canon({...b,ts:0});
function toTrash(kind,item,action){
  if(!item)return;
  S.trash.unshift({id:uid(),kind,action,item:JSON.parse(JSON.stringify(item)),ts:Date.now()});
  TRASH_CHG=true;
}
/* 用新版本换掉旧记录，旧的进回收站（内容没变就不放） */
function replaceHist(id,rec){
  const old=S.hist.find(h=>h.id===id); if(!old)return false;
  rec={...rec,id};                                            // 保留原本的 id，回收站救回才换得回来
  if(!sameRec(old,rec)) toTrash('hist',old,'edit');
  S.hist=S.hist.map(h=>h.id===id?rec:h); return true;
}
/* 整份换掉（还原存档／备份）时，被删或被改的都进回收站 */
function trashDiff(k,next){
  const nx={}; next.forEach(x=>nx[x.id]=canon(x));
  S[k].forEach(x=>{ if(nx[x.id]===undefined)toTrash(k,x,'delete'); else if(nx[x.id]!==canon(x))toTrash(k,x,'edit'); });
}
function trashLabel(t){
  const x=t.item||{};
  if(t.kind==='hist'){ const c=(x.type||'base')==='comm';
    return `${x.empName||''}　${x.year}／${MON[(x.month||1)-1]}　${c?'佣金':'底薪'} ${money(c?x.payout:x.net)}`; }
  if(t.kind==='emp') return '员工　'+(x.name||'');
  if(t.kind==='note') return '备忘　'+String(x.text||'').slice(0,40);
  return t.kind;
}
async function restoreTrash(id){
  const t=S.trash.find(x=>x.id===id); if(!t||!S[t.kind])return;
  const k=t.kind, it=t.item;
  // 同一笔（同 id），或同一个人同一个月同一种类的记录，都算「现在那份」，换掉而不是多一笔
  const cur=S[k].find(x=>x.id===it.id)||(k==='hist'?findDup(it.empId,it.year,it.month,it.type||'base',null):null);
  if(cur){ toTrash(k,cur,'edit'); S[k]=S[k].map(x=>x.id===cur.id?it:x); }
  else S[k].unshift(t.item);
  S.trash=S.trash.filter(x=>x.id!==id); TRASH_CHG=true;
  await save(k); toast('已救回：'+trashLabel(t)); render();
}

function findDup(empId,y,m,type,exceptId){
  return S.hist.find(h=>h.empId===empId&&h.year==y&&h.month==m&&(h.type||'base')===type&&h.id!==exceptId);
}
async function saveRun(){
  const e=empOf(val('eid'));if(!e)return;
  const i=curInput();
  const c=mode==='base'?calcBase(e,i):calcComm(e,i);
  const rec={id:editId||uid(),type:mode,empId:e.id,empName:e.name,category:e.category,
    year:+val('year'),month:+val('month'),remark:val('remark'),...c,ts:Date.now()};
  if(editId){
    if(replaceHist(editId,rec)) toast('记录已更新');
    else { S.hist.unshift(rec); toast('原本那笔已经不在（被删或另一台改过），已另存一笔'); }
    editId=null;dupPending=null;
  }
  else{
    // 警告出现后又换了员工／月份／种类，原本的「覆盖」不算数，重新检查
    if(dupPending&&!(dupPending.rec.empId===rec.empId&&dupPending.rec.year===rec.year&&dupPending.rec.month===rec.month&&dupPending.rec.type===rec.type))dupPending=null;
    const dup=findDup(e.id,rec.year,rec.month,mode,null);
    if(dup&&!dupPending){ collect(); dupPending={rec,dupId:dup.id,dupAmt:(mode==='base'?dup.net:dup.payout)}; render(); return; }   // 先收好输入，重绘后才不会变空白
    if(dupPending&&dupPending.mode==='replace'){ replaceHist(dupPending.dupId,rec); toast('已覆盖原本那笔'); }
    else { S.hist.unshift(rec); toast(mode==='base'?'底薪已存入历史':'佣金已存入历史'); }
    dupPending=null;
  }
  await save('hist');checkMonthDone(rec.type,rec.year,rec.month);FRM={year:rec.year,month:rec.month,eid:e.id};render();
}
function dupChoose(kind){
  if(!dupPending)return;
  if(kind==='cancel'){dupPending=null;render();return;}
  dupPending.mode=kind; saveRun();
}

/* ---- 整月批量 ---- */
let BATCH={type:'base',y:0,m:0,wd:0,rows:{},key:'',dirty:false,stale:false};
/* 历史或员工在别处改过（单人计算、删除、救回、云端同步）：批量页没填东西就直接重载；
   填到一半就先不动，页面上提示「重新载入」 */
function batchInvalidate(){ if(BATCH.dirty)BATCH.stale=true; else BATCH.key=''; }
function bReload(){ BATCH.key='';BATCH.dirty=false;BATCH.stale=false;render(); }
function batchPool(type,y,m){
  const pool=S.emp.filter(x=>inMonth(x,y,m)).sort(nameSort);   // 当月在职（含当月入职／离职）
  if(type==='base') return pool.filter(x=>!x.commOnly||x.commWithBase);
  return pool.filter(x=>!x.commWithBase&&(x.commType!=='none'||x.groupComm!==false));
}
/* 换种类／月份时，从历史把已存的数字带进来；没存过的用空白 */
function batchLoad(){
  const now=new Date();
  if(!BATCH.y){ BATCH.y=FRM.year||now.getFullYear(); BATCH.m=FRM.month||now.getMonth()+1; }
  const key=BATCH.type+'|'+BATCH.y+'|'+BATCH.m;
  if(BATCH.key===key)return;
  BATCH.key=key; BATCH.rows={}; BATCH.wd=0; BATCH.dirty=false; BATCH.stale=false;
  batchPool(BATCH.type,BATCH.y,BATCH.m).forEach(e=>{
    const h=findDup(e.id,BATCH.y,BATCH.m,BATCH.type,null);
    const r=h?{hid:h.id,hbase:h.base,...inputsOf(h)}:{};
    if(!h&&e.commWithBase&&e.commType==='fixed')r.basePayComm=e.commRate;
    if(h&&h.workDays&&!BATCH.wd)BATCH.wd=+h.workDays;
    BATCH.rows[e.id]=r;
  });
  if(!BATCH.wd)BATCH.wd=workDays(BATCH.y,BATCH.m);
}
function bEmp(e){ const r=BATCH.rows[e.id]||{}; return r.hid&&r.hbase!=null?{...e,base:+r.hbase}:e; }
function bCalc(e){
  const r=BATCH.rows[e.id]||{};
  const i={...r,year:BATCH.y,month:BATCH.m,workDays:BATCH.wd};
  return BATCH.type==='base'?calcBase(bEmp(e),i):calcComm(bEmp(e),i);
}
function vBatch(){
  batchLoad();
  const t=BATCH.type, pool=batchPool(t,BATCH.y,BATCH.m);

  const rowsHtml=pool.map(e=>{
    const be=bEmp(e), saved=BATCH.rows[e.id]&&BATCH.rows[e.id].hid;
    let f='';
    if(t==='base'){
      f+=inp(e,'otHours','加班时数')+inp(e,'unpaidDays','无薪假天');
      f+=inp(e,'pcb','PCB',(+be.base||0)<=S.set.pcbThreshold)+inp(e,'advance','预支');
      if(e.commWithBase) f+=e.commType==='percent'?inp(e,'baseSales','销售额 ×'+e.commRate+'%'):inp(e,'basePayComm','佣金 RM');
    }else{
      if(e.commType==='percent') f+=inp(e,'sales','销售额 ×'+e.commRate+'%');
      if(e.groupComm!==false) f+=inp(e,'commGroup','团体佣金');
      f+=inp(e,'wrongQty','包错货')+inp(e,'lateCount','迟到次数')+inp(e,'otherDeduct','其他扣');

  </div>
  ${BATCH.stale?`<div class="warnbox">这个月的记录在别处改过（单人计算、删除、救回，或另一台电脑同步过来）。这页显示的是旧的。<br>
    按「重新载入」看最新的（这页还没存的输入会清掉）；直接「全部存入历史」会用这页的数字盖过去，被盖的旧版本在回收站。

function bSet(k,v){ BATCH[k]=v; render(); }
function bIn(el){ const id=el.dataset.e; (BATCH.rows[id]=BATCH.rows[id]||{})[el.dataset.k]=el.value; BATCH.dirty=true; bRefresh(); }
function bRefresh(){
  const t=BATCH.type; let tot=0,er=0,n=0;
  batchPool(t,BATCH.y,BATCH.m).forEach(e=>{
    const c=bCalc(e), pay=t==='base'?c.net:c.payout; tot+=pay; n++;
    if(t==='base')er+=c.epfEr+c.socsoEr+c.eisEr;
    const a=document.getElementById('bn_'+e.id); if(a)a.textContent=money(pay);
    const x=document.getElementById('bx_'+e.id);
    if(x){ const bits=[];
      if(t==='comm'){ if(c.groupVoided)bits.push('迟到满 '+S.set.lateNoGroup+' 次，团体佣金归零');
        if(c.lateDeduct)bits.push('迟到扣 '+money(c.lateDeduct));
        if(c.spill)bits.push('不够扣，结欠 '+money(c.spill)); }
      else{ if(c.absentDeduct)bits.push('未在职 '+c.absentDays+' 天 −'+money(c.absentDeduct));
        if(c.otTotal)bits.push('加班 +'+money(c.otTotal)); if(c.unpaidDeduct)bits.push('无薪假 −'+money(c.unpaidDeduct)); }
      x.textContent=bits.join('　·　'); x.style.color=t==='comm'?'':'var(--ink2)'; }
  });
  const b=document.getElementById('btot');
  if(b)b.innerHTML=`<div><span>${MON[BATCH.m-1]} ${t==='base'?'底薪实收':'佣金实发'}合计 · ${n} 人</span><span>${money(tot)}</span></div>`+
    (t==='base'?`<div><span>雇主 EPF+SOCSO+EIS</span><span>${money(er)}</span></div>`:'');
}
async function bSave(){
  const t=BATCH.type; let add=0,upd=0;
  batchPool(t,BATCH.y,BATCH.m).forEach(e=>{
    const r=BATCH.rows[e.id]||{}, c=bCalc(e);
    // 批量页载入之后，别处可能已经存了这个人这个月：更新那一笔，绝不另存一笔
    let hid=r.hid&&S.hist.some(h=>h.id===r.hid)?r.hid:null;
    if(!hid){ const d=findDup(e.id,BATCH.y,BATCH.m,t,null); if(d)hid=d.id; }
    const old=hid?S.hist.find(h=>h.id===hid):null;
    const rec={id:hid||uid(),type:t,empId:e.id,empName:e.name,category:e.category,
      year:BATCH.y,month:BATCH.m,remark:r.remark??(old&&old.remark)??'',...c,ts:Date.now()};
    if(old){ if(!sameRec(old,rec)){ replaceHist(hid,rec); upd++; } } else { S.hist.unshift(rec); add++; }
  });
  BATCH.dirty=false; BATCH.stale=false;
  await save('hist'); BATCH.key='';
  checkMonthDone(t,BATCH.y,BATCH.m);
  toast(`已存：新增 ${add} 笔${upd?'，更新 '+upd+' 笔':''}`); render(); scrollTo(0,0);
}

/* ---- 工资单（打印／存成 PDF） ---- */
const MON_EN=['January','February','March','April','May','June','July','August','September','October','November','December'];
let PRINT_TITLE='';
/* 一个人一个月的工资单内容。打印（PDF）和 WhatsApp 文字共用 */
function slipModel(empId,y,m){
  const b=S.hist.find(h=>h.empId===empId&&h.year==y&&h.month==m&&(h.type||'base')==='base');
  const c=S.hist.find(h=>h.empId===empId&&h.year==y&&h.month==m&&h.type==='comm');
  if(!b&&!c)return null;
  const secs=[];
  if(b){
    const adv=+b.advance||0, back=adv<0?-adv:0;
    const ded=r2((+b.epfEmp||0)+(+b.socsoEmp||0)+(+b.eisEmp||0)+(+b.pcb||0)+Math.max(0,adv));
    secs.push({title:['Earnings','收入'],rows:[
      ['Basic Salary','底薪',b.base,1],
      ['Not employed ('+(+b.absentDays||0)+' days)','未在职',-(+b.absentDeduct||0)],
      ['Unpaid Leave ('+(+b.unpaidDays||0)+' days)','无薪假',-(+b.unpaidDeduct||0)],
      ['Overtime ('+(+b.otHours||0)+' hrs)','加班',b.otTotal],
      ['Commission','佣金',b.payComm],
      ['Back Pay','补发',back]],
      total:['Gross Pay','总收入',r2((+b.gross||0)+back)]});
    secs.push({title:['Deductions','扣除'],rows:[
      ['EPF (KWSP)','公积金',b.epfEmp],
      ['SOCSO (PERKESO)'+(b.skbbk?' + SKBBK':''),'社险',b.socsoEmp],
      ['EIS (SIP)','就业保险',b.eisEmp],
      ['PCB / MTD','月扣税',b.pcb],
      ['Advance / Others','预支／其他',Math.max(0,adv)]],
      total:['Total Deductions','扣除合计',ded],net:['Net Pay','实收',b.net]});
  }
  if(c){
    const legacy=c.extraPay==null;                               // v2 的记录：负数其他扣款直接算在 totalDeduct 里
    const X=legacy?0:Math.max(0,-(+c.otherDeduct||0));           // 补发（其他扣款填负数）
    const taken=r2((+c.totalDeduct||0)-(+c.spill||0));
    const gross=r2((+c.payout||0)+taken-X);                       // 扣款前的个人＋团体佣金
    const grp=c.groupVoided?0:Math.min(gross,+groupInOf(c)||0);
    secs.push({title:['Commission','佣金'],rows:[
      ['Personal Commission'+(+c.sales?' (Sales '+r2(c.sales).toLocaleString('en-MY',{minimumFractionDigits:2})+')':''),'个人佣金',r2(gross-grp)],
      ['Group Commission','团体佣金',grp],
      ['Back Pay','补发',X],
      ['Wrong Packing ('+(+c.wrongQty||0)+')','包错货',-(+c.wrongGoods||0)],
      ['Late ('+(+c.lateCount||0)+' times)','迟到',-(+c.lateDeduct||0)],
      ['Other Deductions','其他扣款',legacy?-(+c.otherDeduct||0):-Math.max(0,+c.otherDeduct||0)],
      ['Not covered (outstanding)','不够扣，结欠',+c.spill||0]],
      net:['Commission Paid','佣金实发',c.payout]});
  }
  return {name:(b||c).empName,y,m,b,c,secs,
    total:b&&c?['Total for '+MON_EN[m-1],'本月合计',r2((+b.net||0)+(+c.payout||0))]:null};
}
const fmtRM=v=>(+v<0?'-':'')+Math.abs(r2(+v||0)).toLocaleString('en-MY',{minimumFractionDigits:2,maximumFractionDigits:2});
function payslipHTML(empId,y,m){
  const M=slipModel(empId,y,m); if(!M)return '';
  const L=([en,zh,v,force])=>(force||+v)?`<tr><td>${esc(en)}<span class="zh">${zh}</span></td><td class="n">${fmtRM(v)}</td></tr>`:'';
  const h=M.secs.map(s=>`<table><tr><th>${s.title[0]} ${s.title[1]}</th><th style="text-align:right">RM</th></tr>
      ${s.rows.map(L).join('')}
      ${s.total?`<tr class="t"><td>${s.total[0]}<span class="zh">${s.total[1]}</span></td><td class="n">${fmtRM(s.total[2])}</td></tr>`:''}
      ${s.net?`<tr class="pnet"><td>${s.net[0]}<span class="zh">${s.net[1]}</span></td><td class="n">${fmtRM(s.net[2])}</td></tr>`:''}</table>`).join('')
    +(M.total?`<table><tr class="pnet"><td>${M.total[0]}<span class="zh">${M.total[1]}</span></td><td class="n">${fmtRM(M.total[2])}</td></tr></table>`:'');
  const b=M.b;
  return `<div class="ps">
    <div class="ph"><div><div class="co">${esc(S.set.company||'')}</div><div class="ti">PAYSLIP 工资单</div></div>
      <div class="pd">${MON_EN[m-1]} ${y}${b?'<br>Working days: '+b.workDays:''}</div></div>
    <div class="who">${esc(M.name)}</div>
    ${h}
    ${b?`<div class="ft">Employer contribution 雇主缴纳 — EPF ${fmtRM(b.epfEr)} · SOCSO ${fmtRM(b.socsoEr)} · EIS ${fmtRM(b.eisEr)}</div>`:''}
    <div class="ft">This is a computer-generated payslip. 本工资单由电脑生成。</div>
  </div>`;
}
/* WhatsApp：文字版工资单，打开 WhatsApp 让你自己按发送 */
function payslipText(empId,y,m){
  const M=slipModel(empId,y,m); if(!M)return '';
  const out=[`*PAYSLIP 工资单 · ${MON_EN[m-1]} ${y}*`];
  if(S.set.company)out.push(S.set.company);
  out.push(M.name,'');
  M.secs.forEach(s=>{
    out.push(`*${s.title[0]} ${s.title[1]}*`);
    s.rows.forEach(([en,zh,v,force])=>{ if(force||+v)out.push(`${en} ${zh}: RM ${fmtRM(v)}`); });
    if(s.total)out.push(`${s.total[0]} ${s.total[1]}: RM ${fmtRM(s.total[2])}`);
    if(s.net)out.push(`*${s.net[0]} ${s.net[1]}: RM ${fmtRM(s.net[2])}*`);
    out.push('');
  });
  if(M.total)out.push(`*${M.total[0]} ${M.total[1]}: RM ${fmtRM(M.total[2])}*`);
  return out.join('\n').trim();
}
function waPhone(p){ let d=String(p||'').replace(/\D/g,''); if(!d)return ''; if(d[0]==='0')d='6'+d; return d; }

/* 按员工查：选了员工 + 年份，列出那一年每个月 */
function yearRows(empId,y){
  const rs=[]; for(let m=1;m<=12;m++){
    const b=S.hist.find(h=>h.empId===empId&&h.year==y&&h.month==m&&(h.type||'base')==='base');
    const c=S.hist.find(h=>h.empId===empId&&h.year==y&&h.month==m&&h.type==='comm');
    if(b||c)rs.push({m,net:b?+b.net||0:0,comm:c?+c.payout||0:0,gross:b?r2((+b.gross||0)+Math.max(0,-(+b.advance||0))):0,   // 总收入含补发，跟工资单一致
      epf:b?+b.epfEmp||0:0,socso:b?+b.socsoEmp||0:0,eis:b?+b.eisEmp||0:0,pcb:b?+b.pcb||0:0});
  }
  const T={}; ['net','comm','gross','epf','socso','eis','pcb'].forEach(k=>T[k]=r2(rs.reduce((a,r)=>a+r[k],0)));
  return {rs,T};
}

/* 发完薪提醒备份：一个月的底薪或佣金全部存好时，跳一次 */
let BACKUP_PROMPT=null;
function checkMonthDone(type,y,m){
  const pool=batchPool(type,y,m); if(!pool.length)return;
  const done=new Set(S.hist.filter(h=>h.year==y&&h.month==m&&(h.type||'base')===type).map(h=>h.empId));
  if(!pool.every(x=>done.has(x.id)))return;
  const key=type+'|'+y+'|'+m;
  if((META.prompted||[]).includes(key))return;
  BACKUP_PROMPT={type,y,m,key};
}
function backupCard(){
  if(!BACKUP_PROMPT)return '';
  const {type,y,m}=BACKUP_PROMPT;
  return `<div class="card" style="border-color:var(--jade);background:var(--jade-soft)">
    <div style="color:var(--jade);font-weight:600;margin-bottom:8px">✓ ${y}／${MON[m-1]}的${type==='base'?'底薪':'佣金'}全部存好了，顺手备份一下</div>
    <div class="row">
      <div><button class="btn sm" style="width:100%" onclick="backup();doneBackupPrompt()">下载完整备份</button></div>
      <div><button class="btn alt sm" style="width:100%" onclick="expMonth(${y},${m},'${type}')">导出本月 Excel</button></div>
    </div>
    <button class="btn alt sm" style="width:100%;margin-top:8px" onclick="doneBackupPrompt()">以后再说</button>
  </div>`;
}
async function doneBackupPrompt(){
  if(!BACKUP_PROMPT)return;
  META.prompted=[...(META.prompted||[]),BACKUP_PROMPT.key].slice(-48);
  try{ await STORE.set(K_META,JSON.stringify(META)); }catch(e){}
  BACKUP_PROMPT=null; render();
}
function expMonth(y,m,type){

function empTags(x,t){
  const q=(on,a,b)=>on?`<span class="tag">${a}</span>`:`<span class="tag q">${b}</span>`;
  let s=`<span class="tag">${x.category==='local'?'本地&lt;60':x.category==='local60'?'本地60+':'外劳'}</span>`;
  s+=q(!x.noEpf,'EPF','无EPF')+q(!x.noSocso,'SOCSO'+(x.skbbk!==false?'+SKBBK':''),'无SOCSO')+q(!x.noEis&&x.category==='local','EIS','无EIS');

async function addEmp(){
  const name=val('n_name').trim();if(!name){toast('请填姓名');return;}
  const co=document.getElementById('n_co').checked;
  const rec={name,commOnly:co,base:co?0:num('n_base'),category:val('n_cat'),marital:val('n_mar'),kids:num('n_kids'),
    commType:val('n_ct'),commRate:num('n_cr'),epfOptIn:document.getElementById('n_epf').checked,
    groupComm:document.getElementById('n_grp').checked,
    commWithBase:document.getElementById('n_cwb').checked,
    skbbk:document.getElementById('n_skbbk').checked, status:val('n_status')||'active',
    noEpf:!document.getElementById('n_hasEpf').checked,
    noSocso:!document.getElementById('n_hasSocso').checked,
    noEis:!document.getElementById('n_hasEis').checked,
    joinDate:val('n_join'), leaveDate:val('n_leave'), phone:val('n_phone').trim()};
  if(rec.joinDate&&rec.leaveDate&&rec.leaveDate<rec.joinDate){toast('离职日期不能早过入职日期');return;}
  if(rec.base<0||rec.commRate<0||rec.kids<0){toast('底薪、佣金、孩子人数不能是负数');return;}
  if(editEmpId){
    const old=S.emp.find(x=>x.id===editEmpId), nw={...old,...rec};
    if(old&&JSON.stringify(old)!==JSON.stringify(nw))toTrash('emp',old,'edit');
    S.emp=S.emp.map(x=>x.id===editEmpId?nw:x);editEmpId=null;toast('已更新 '+name);
  }
  else{S.emp.push({id:uid(),...rec});toast('已加入 '+name);}
  await save('emp');render();
}
async function delEmp(id){
  const n=S.hist.filter(h=>h.empId===id).length;
  if(n){toast('有 '+n+' 笔历史记录，不能删除。不再上班请填离职日期或改成已离职');return;}
  if(delArm!=='e'+id){delArm='e'+id;render();setTimeout(()=>{if(delArm==='e'+id){delArm=null;render();}},3500);return;}
  toTrash('emp',S.emp.find(x=>x.id===id),'delete');
  S.emp=S.emp.filter(x=>x.id!==id);delArm=null;await save('emp');toast('已删除（30 天内可在设定 → 回收站救回）');render();
}

function dupCard(){
  const seen={}, dups={};
  S.hist.forEach(h=>{const k=h.empId+'|'+h.year+'|'+h.month+'|'+(h.type||'base');
    if(seen[k])dups[k]=(dups[k]||1)+1; else seen[k]=1;});
  const keys=Object.keys(dups); if(!keys.length)return '';
  return `<div class="card" style="border-color:var(--rust);background:var(--rust-soft)">
    <h3 style="color:var(--rust)">⚠ 有重复记录 · ${keys.length} 组</h3>
    <div style="font-size:14px;line-height:1.9">${keys.map(k=>{const [id,y,m,t]=k.split('|');
      const nm=(S.emp.find(x=>x.id===id)||{}).name||(S.hist.find(h=>h.empId===id)||{}).empName||id;
      return esc(nm)+'　'+y+'／'+MON[+m-1]+'　'+(t==='comm'?'佣金':'底薪')+'　'+dups[k]+' 笔';}).join('<br>')}</div>
    <div class="hint">同一个人、同一个月、同一种类存了不止一笔。下面找出来，多余的删掉。</div>
  </div>`;
}
function missingCard(){
  const fy=FRM.fy??'all', fm=FRM.fm??'all', ft=FRM.ft??'all';
  if(fy==='all'||fm==='all'||ft==='all') return `<div class="hint" style="margin:-4px 0 12px">选定「年份 + 月份 + 种类」后，这里会列出还没算的员工。</div>`;
  const done=new Set(S.hist.filter(h=>h.year==+fy&&h.month==+fm&&(h.type||'base')===ft).map(h=>h.empId));
  const pool=batchPool(ft,+fy,+fm);

/* 编辑旧记录时用当时的底薪，不用现在的（调过薪也不影响旧月份） */
function empOf(id){
  const e=S.emp.find(x=>x.id===id); if(!e)return null;
  const h=editId&&S.hist.find(x=>x.id===editId);
  return (h&&h.empId===id&&h.base!=null)?{...e,base:+h.base}:e;
}
/* 团体佣金的原始输入。旧记录只存了扣完的数，按「先扣团体、再扣个人」倒推 */
function groupInOf(h){
  if(h.commGroupIn!=null)return h.commGroupIn;
  const D=+h.totalDeduct||0;
  if(!D||h.groupVoided)return h.commGroup;
  if(+h.commGroup>0)return r10c(+h.commGroup+D);
  const e=S.emp.find(x=>x.id===h.empId)||{};
  const P=e.commType==='percent'?r10c((+h.sales||0)*(+e.commRate||0)/100):e.commType==='fixed'?r10c(+e.commRate||0):0;
  return Math.max(0,r10c((D-(+h.spill||0))-(P-(+h.commPersonal||0))));
}
/* 从一笔历史记录还原当初的输入（编辑和批量页共用） */
function inputsOf(h){
  // 旧记录没有分开存「其他佣金／加额」，从总数倒推回来，金额不变
  const legacy=h.baseExtraComm==null;
  const extra=legacy?(h.baseSales?r2((+h.payComm||0)-r10c(h.baseSales*(+h.baseRate||0)/100)):0):h.baseExtraComm;
  return {workDays:h.workDays,otHours:h.otHours,unpaidDays:h.unpaidDays,pcb:h.pcb,advance:h.advance,
    basePayComm:legacy?h.payComm:h.basePayComm,baseExtraComm:extra||'',baseSales:h.baseSales,baseRate:h.baseRate,
    sales:h.sales,commGroup:groupInOf(h),wrongQty:h.wrongQty,lateCount:h.lateCount,otherDeduct:h.otherDeduct,remark:h.remark};
}
function editRec(id){
  const h=S.hist.find(x=>x.id===id);if(!h)return;
  if(!S.emp.some(x=>x.id===h.empId)){toast('这位员工已被删除，不能编辑，只能删掉重算');return;}
  editId=id;tab='calc';mode=h.type||'base';dupPending=null;
  FRM={eid:h.empId,year:h.year,month:h.month,...inputsOf(h)};
  render();scrollTo(0,0);
}
async function delRec(id){
  if(delArm!=='h'+id){delArm='h'+id;render();setTimeout(()=>{if(delArm==='h'+id){delArm=null;render();}},3500);return;}

const BASE_KEYS=new Set(['_stat','_epfTot','_socsoTot','_eisTot','base','workDays','otHours','otTotal','absentDays','absentDeduct','unpaidDays','unpaidDeduct','epfEmp','epfEr','socsoEmp','socsoEr','eisEmp','eisEr','pcb','advance','baseSales','baseRate','payComm','net']);
const COMM_KEYS=new Set(['sales','commPersonal','commGroup','wrongQty','wrongGoods','lateCount','lateDeduct','otherDeduct','extraPay','totalDeduct','spill','payout']);
const ALWAYS=new Set(['_no','empName','_pay','type','year','month']);
function activeCols(list){
  const ft=FRM.ft??'all';
  let cols=COLS;
  if(ft==='base') cols=cols.filter(([,k])=>!COMM_KEYS.has(k));
  else if(ft==='comm') cols=cols.filter(([,k])=>!BASE_KEYS.has(k)||k==='base');
  // 再拿掉整栏都空白／全是 0 的项目
  return cols.filter(([,k])=>{
    if(ALWAYS.has(k)) return true;
    return list.some(h=>{const v=CALC[k]?CALC[k](h):h[k];
      if(v===undefined||v===null||v==='') return false;
      if(typeof v==='number') return v!==0;
      return String(v).trim()!=='';});
  });
}
const byName=(a,b)=>String(a.empName||'').localeCompare(String(b.empName||''),'en',{sensitivity:'base',numeric:true});
function rows(){
  const list=histList().slice().sort((a,b)=>byName(a,b)||(a.year-b.year)||(a.month-b.month));
  const COLS=activeCols(list);
  const body=list.map((h,idx)=>COLS.map(([,k])=>{
    if(k==='_no')return idx+1;
    if(k==='_pay')return r2(payOf(h));
    if(k==='type')return (h.type||'base')==='comm'?'佣金':'底薪';
    if(CALC[k])return CALC[k](h);
    return h[k]??'';
  }));
  const tot=COLS.map(([,k])=>{
    if(k==='_no')return '合计';
    if(k==='_pay')return r2(list.reduce((a,h)=>a+payOf(h),0));
    if(k==='empName'||k==='type'||k==='year'||k==='month'||k==='remark'||k==='baseRate')return '';
    if(CALC[k])return r2(list.reduce((a,h)=>{const v=CALC[k](h);return a+(typeof v==='number'?v:0);},0))||'';
    const v=r2(list.reduce((a,h)=>a+(typeof h[k]==='number'?h[k]:0),0));
    return v||'';
  });
  return {head:COLS.map(c=>c[0]),body,tot,n:list.length};
}
function expName(){
  const ft=FRM.ft??'all', fy=FRM.fy??'all', fm=FRM.fm??'all', fe=FRM.fe??'all';
  const who=fe==='all'?'':(((S.emp.find(x=>x.id===fe)||S.hist.find(h=>h.empId===fe)||{}).name||(S.hist.find(h=>h.empId===fe)||{}).empName||'')+'_');
  const kind = who+(ft==='comm'?'佣金记录':ft==='base'?'底薪记录':'薪资记录');
  let period='';
  if(fy!=='all'&&fm!=='all') period='_'+fy+'年'+String(fm).padStart(2,'0')+'月';
  else if(fy!=='all') period='_'+fy+'年';
  const today=new Date().toISOString().slice(0,10);
  return {base:kind+period+'_'+today, sheet:ft==='comm'?'佣金记录':ft==='base'?'底薪记录':'薪资记录'};   // 工作表名最多 31 字，不放姓名
}
function expCSV(){const{head,body,tot,n}=rows();if(!n){toast('没有记录可导出');return;}
  const csv=[head,...body,tot].map(r=>r.map(c=>`"${String(c).replace(/"/g,'""')}"`).join(',')).join('\n');
  dl(new Blob(['\ufeff'+csv],{type:'text/csv'}),expName().base+'.csv');}
function expXLSX(){const{head,body,tot,n}=rows();if(!n){toast('没有记录可导出');return;}
  if(typeof XLSX==='undefined'){toast('Excel 模块没载入，改用 CSV');expCSV();return;}
  const ws=XLSX.utils.aoa_to_sheet([head,...body,tot]);
  ws['!cols']=head.map((h,i)=>({wch:i===1?30:(i===0?6:14)}));

  const wb=XLSX.utils.book_new();
  const nm=expName();
  XLSX.utils.book_append_sheet(wb,ws,nm.sheet);XLSX.writeFile(wb,nm.base+'.xlsx');}
function dl(blob,name){const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000);}

async function addNote(){

    S.note=S.note.map(n=>n.id===editNoteId?{...n,text:t,year:y,month:m}:n);
    editNoteId=null; toast('备忘已更新');

    S.note.unshift({id:uid(),text:t,year:y,month:m,ts:Date.now(),done:false});

}

async function shareBackup(){
  const txt=JSON.stringify(S);
  const name='薪资备份_'+new Date().toISOString().slice(0,10)+'.json';
  try{
    const file=new File([txt],name,{type:'application/json'});

      await navigator.share({files:[file],title:name}); markBackup(); render(); return;
    }
  }catch(e){ if(e&&e.name==='AbortError') return; }

  catch(e){ if(e&&e.name==='AbortError') return; }
  toast('这个浏览器不支持分享，改用下载或复制');

async function restoreSnap(i){
  if(delArm!=='s'+i){delArm='s'+i;render();setTimeout(()=>{if(delArm==='s'+i){delArm=null;render();}},4000);return;}
  const o=JSON.parse(SNAPS[i].data);
  trashDiff('emp',o.emp||[]);trashDiff('hist',o.hist||[]);trashDiff('note',o.note||[]);   // 被盖掉的先进回收站
  S.emp=o.emp||[];S.hist=o.hist||[];S.note=o.note||[];S.set={...DEF_SET,...(o.set||{})};
  delArm=null; const ts=SNAPS[i].ts;
  await save('emp');await save('hist');await save('note');await save('set');   // 一起推上云端
  toast('已还原到 '+new Date(ts).toLocaleString('zh-Hans'));render();
}
async function copyBackup(){
  const txt=JSON.stringify(S);
  // 方法一：现代剪贴板 API
  try{ await navigator.clipboard.writeText(txt); toast('备份文字已复制'); markBackup(); return; }catch(e){}
  // 方法二：旧式 execCommand（iframe 里通常可用）
  try{
    const ta=document.createElement('textarea');
    ta.value=txt; ta.style.position='fixed'; ta.style.top='0'; ta.style.left='0';
    ta.style.width='1px'; ta.style.height='1px'; ta.style.opacity='0';
    document.body.appendChild(ta); ta.focus(); ta.select(); ta.setSelectionRange(0,txt.length);
    const ok=document.execCommand('copy');
    document.body.removeChild(ta);
    if(ok){ toast('备份文字已复制'); markBackup(); return; }
  }catch(e){}
  // 方法三：填进框里，选好，让使用者自己按复制
  const t=document.getElementById('imp');
  if(t){ t.value=txt; t.focus(); t.select(); t.setSelectionRange(0,txt.length);
    toast('已选好，按一下「复制／Copy」'); }
}
async function mergeRestore(){
  const raw=val('imp').trim(); if(!raw){toast('先把备份文字贴进框里');return;}
  let d; try{d=JSON.parse(raw);}catch(e){toast('这段文字不是有效的备份');return;}
  if(!d||typeof d!=='object'||!('emp' in d||'hist' in d)){toast('这段文字不是这个 App 的备份');return;}
  const r={emp:0,hist:0,note:0,skip:0};

  // 员工：以 id 比对，没有就用姓名比对
  const byId=new Set(S.emp.map(x=>x.id));
  const byNm=new Set(S.emp.map(x=>String(x.name||'').trim().toUpperCase()));
  (d.emp||[]).forEach(x=>{
    if(byId.has(x.id)||byNm.has(String(x.name||'').trim().toUpperCase()))return;
    S.emp.push(x); byId.add(x.id); byNm.add(String(x.name||'').trim().toUpperCase()); r.emp++;
  });

  // 历史：同 id 跳过；同员工+同年月+同种类也跳过（避免重复）
  const hId=new Set(S.hist.map(h=>h.id));
  const hKey=new Set(S.hist.map(h=>h.empId+'|'+h.year+'|'+h.month+'|'+(h.type||'base')));
  (d.hist||[]).forEach(h=>{
    const k=h.empId+'|'+h.year+'|'+h.month+'|'+(h.type||'base');
    if(hId.has(h.id)||hKey.has(k)){r.skip++;return;}
    S.hist.push(h); hId.add(h.id); hKey.add(k); r.hist++;
  });
  S.hist.sort((a,b)=>(b.year-a.year)||(b.month-a.month)||(b.ts||0)-(a.ts||0));

  // 备忘：同 id 或同内容+同年月就跳过
  const nId=new Set(S.note.map(n=>n.id));
  const nKey=new Set(S.note.map(n=>{const y=noteYM(n);return n.text+'|'+y.y+'|'+y.m;}));
  (d.note||[]).forEach(n=>{
    const y=noteYM(n), k=n.text+'|'+y.y+'|'+y.m;
    if(nId.has(n.id)||nKey.has(k))return;
    S.note.push(n); nId.add(n.id); nKey.add(k); r.note++;
  });

  await save('emp'); await save('hist'); await save('note');
  MERGE_MSG=`合并完成：新增员工 ${r.emp} 人、历史 ${r.hist} 笔、备忘 ${r.note} 条${r.skip?`，已有的 ${r.skip} 笔跳过`:''}。目前共 ${S.emp.length} 人、${S.hist.length} 笔记录。`;
  toast('合并完成'); render();
  setTimeout(()=>{MERGE_MSG='';},30000);
}
async function restore(){
  const raw=val('imp').trim();if(!raw){toast('先把备份文字贴进框里');return;}
  let d;try{d=JSON.parse(raw);}catch(e){toast('这段文字不是有效的备份');return;}
  if(!d||typeof d!=='object'||!('emp' in d||'hist' in d)){toast('这段文字不是这个 App 的备份');return;}
  if(delArm!=='r'){delArm='r';render();document.getElementById('imp').value=raw;setTimeout(()=>{if(delArm==='r'){delArm=null;render();}},4000);return;}
  trashDiff('emp',d.emp||[]);trashDiff('hist',d.hist||[]);trashDiff('note',d.note||[]);   // 被盖掉的先进回收站
  S.emp=d.emp||[];S.hist=d.hist||[];S.note=d.note||[];S.set={...DEF_SET,...(d.set||{})};
  delArm=null;await save('emp');await save('hist');await save('note');await save('set');
  toast('已还原：员工 '+S.emp.length+' 人，历史 '+S.hist.length+' 笔');render();
}

document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>{if(tab==='calc'&&S.emp.length)collect();tab=b.dataset.t;delArm=null;render();});
/* 一定要登入才看得到资料。没登入时不读本机快取、不画画面 */
(async()=>{
  if(!loadCfg()){ showGate(); return; }
  if(!initSB()){ showGate(); return; }
  const {data}=await SB.auth.getSession();
  if(data&&data.session){ USER=data.session.user; await afterLogin(); }
  else { showGate(); showAuth(); }
})();
document.addEventListener('visibilitychange',()=>{ if(!document.hidden&&SB&&USER){ pullAll().then(ch=>{ if(ch)safeRender(); }); } });
window.addEventListener('online',()=>{ if(SB&&USER) pullAll().then(ch=>{ if(ch)safeRender(); }); });
window.addEventListener('afterprint',()=>{ document.body.classList.remove('printing'); document.getElementById('printArea').innerHTML=''; if(PRINT_TITLE){document.title=PRINT_TITLE;PRINT_TITLE='';} });
