<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}HomeWorks{% endblock %} · HomeWorks 营运入口</title>
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<nav class="side">
  <div class="brand">HomeWorks<br><small>营运入口 v0.2</small></div>
  <a href="/dashboard" class="{{ 'on' if nav == 'dashboard' else '' }}">仪表板</a>
  <a href="/inventory" class="{{ 'on' if nav == 'inventory' else '' }}">库存</a>
  <a href="/deliveries" class="{{ 'on' if nav == 'deliveries' else '' }}">出货跟踪</a>
  <div class="src">资料来源：{{ source_name }}</div>
  {% if user %}<div class="src">{{ user.email }}<br><a href="/logout">登出</a></div>{% endif %}
</nav>
<main>
{% block body %}{% endblock %}
</main>
</body>
</html>
